# ── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ── Database ─────────────────────────────────────────────────────────────────
# Create the schema first: CREATE DATABASE rentvideo_db;
spring.datasource.url=jdbc:mysql://localhost:3306/rentvideo_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
# 'update' creates/alters tables automatically — switch to 'validate' in production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
